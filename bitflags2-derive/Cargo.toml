[package]
name = "bitflags2-derive"
version = "0.1.3"
edition = "2024"
description = "Attribute macro implementation for the bitflags2 crate"
readme = "README.md"
license = "MIT"
authors = ["cet"]
repository = "https://github.com/cet-t/bitflags2"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
